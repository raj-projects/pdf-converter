version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: pdflab-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: pdflab
      MONGO_INITDB_ROOT_PASSWORD: pdflab

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pdflab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pdflab-worker
    depends_on:
      - mongo
      - redis
    environment:
      MONGO_URI: mongodb://pdflab:pdflab@mongo:27017/pdflab
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      - ./workers:/app/workers
      - ./lib:/app/lib

volumes:
  mongo_data:
  redis_data:
